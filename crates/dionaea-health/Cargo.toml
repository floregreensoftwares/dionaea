[package]
name = "dionaea-health"
description = "App health rules for Dionaea: message scrubbing, route templating and stack frames"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
bench = false

[lints]
workspace = true

[dependencies]
dionaea-core = { version = "0.0.0", path = "../dionaea-core" }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.12.0"
serde_json = "1.0.154"

[[bench]]
name = "scrub"
harness = false
