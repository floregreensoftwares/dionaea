[package]
name = "dionaea-ingest"
description = "The ingest path of Dionaea: admission, limits and the pipeline from request body to accepted events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
bench = false

[lints]
workspace = true

[dependencies]
dionaea-artifacts = { version = "0.0.0", path = "../dionaea-artifacts" }
dionaea-core = { version = "0.0.0", path = "../dionaea-core" }
dionaea-health = { version = "0.0.0", path = "../dionaea-health" }
dionaea-meta = { version = "0.0.0", path = "../dionaea-meta" }
dionaea-spool = { version = "0.0.0", path = "../dionaea-spool" }
dionaea-store = { version = "0.0.0", path = "../dionaea-store" }
maxminddb = "0.32.0"
serde_json = "1.0.154"
woothee = "0.13.0"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "pipeline"
harness = false
