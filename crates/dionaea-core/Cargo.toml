[package]
name = "dionaea-core"
description = "Event schema model and privacy guard shared by the Dionaea server and SDKs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
bench = false

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
jsonschema = { version = "0.58.6", default-features = false }

[[bench]]
name = "guard"
harness = false

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "diff"
harness = false

[[bench]]
name = "wire"
harness = false
