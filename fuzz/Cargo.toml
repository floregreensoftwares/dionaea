[package]
name = "dionaea-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
dionaea-core = { path = "../crates/dionaea-core" }

# Not part of the main workspace: it needs a nightly compiler and builds with
# sanitizer flags.
[workspace]

[[bin]]
name = "parse_schema"
path = "fuzz_targets/parse_schema.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_batch"
path = "fuzz_targets/decode_batch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_identify"
path = "fuzz_targets/decode_identify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "guard_event"
path = "fuzz_targets/guard_event.rs"
test = false
doc = false
bench = false
