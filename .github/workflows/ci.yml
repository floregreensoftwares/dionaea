name: ci

on:
  push:
    branches: [trigger, snap]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run useless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  # The same check the commit-msg and pre-push hooks run, for commits made
  # without the hooks installed.
  messages:
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | sh .githooks/check-message; then
              echo "offending commit: $sha"
              status=1
            fi
          done
          exit $status

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install toolchain
        run: rustup toolchain install

      # The target folder is set to .cargo-target by .cargo/config.toml.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> .cargo-target"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/trigger' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Clippy type-checks every target, so a separate `cargo check` would
      # only compile the same code again.
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

  # Real commits against the hooks in a clean clone, as a contributor sees them.
  hooks:
    name: hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install
      - name: Verify the commit hooks
        run: sh scripts/verify-hooks.sh

  # The development ClickHouse comes up and the built binary reaches it.
  compose:
    name: compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> .cargo-target"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/trigger' }}
      - name: Build the binary
        run: cargo build -p dionaea --locked
      - name: Verify the compose stack
        run: sh scripts/verify-compose.sh

  # The base revision and this one, benchmarked one after the other on the
  # same runner. It reports changes and never fails on a slowdown: shared
  # runners are too noisy for a threshold. It fails only if a benchmark breaks.
  bench:
    name: benchmarks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: rustup toolchain install
      - name: Compare with the base revision
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BENCH_MEASURE: 5
          BENCH_NOISE_FLOOR: 1
        run: |
          # Nothing to measure when the pull request touches no Rust code.
          if ! git diff --name-only "$BASE" HEAD | grep -qE '^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|scripts/bench-compare\.sh$)'; then
            echo 'No Rust code changed; benchmarks skipped.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          started=$SECONDS
          sh scripts/bench-compare.sh "$BASE" 2>&1 | tee bench.txt
          {
            echo '### Benchmarks against the base revision'
            echo
            echo "Took $((SECONDS - started)) s. The base revision is measured twice: the section named noise floor compares it with itself, so any change there is noise. Read the last section against it, and trust only changes well above it that repeat."
            echo
            echo '```'
            grep -vE '^(Benchmarking|Warning:|$)|^ *(Compiling|Finished|Running|Downloaded|Downloading|Locking|Adding|Updating)|outliers|^Found|^ +thrpt|^ +[0-9]+ \(' bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # One check to require in branch protection.
  ci:
    name: ci
    if: always()
    needs: [messages, rust, hooks, compose, bench]
    runs-on: ubuntu-latest
    steps:
      - name: Check the results
        run: |
          echo '${{ toJSON(needs) }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            exit 1
          fi
